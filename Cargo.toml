[package]
name = "triklops"
version = "0.4.0"
edition = "2024"

[dependencies]
rand = "0.10.4"
svg = "0.18.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = "0.37.0"
image = "0.25.10"
rayon = "1.12.0"
rfd = "0.18.0"
env_logger = "0.11.11"
pollster = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = "0.3"
serde = { version = "1", features = ["derive", "rc"] }
serde_bytes = "0.11"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "DedicatedWorkerGlobalScope", "ErrorEvent", "File", "HtmlCanvasElement",
    "MessageEvent", "Performance", "Worker", "WorkerOptions", "WorkerType",
] }

[[bench]]
name = "approximation"
harness = false
